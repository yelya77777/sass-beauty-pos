<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SassSkin POS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}.wrap{max-width:1250px;margin:auto;padding:16px}
.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;border:1px solid #ccc;border-radius:9px;padding:10px;background:#fff}button{cursor:pointer}.black,.active{background:#111!important;color:#fff!important;border-color:#111!important}
.card{background:#fff;border-radius:14px;padding:15px;box-shadow:0 1px 4px #0001}.grid{display:grid;grid-template-columns:2fr 1fr;gap:15px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.product{text-align:left}.muted{font-size:12px;color:#666}.price{font-weight:700;margin:6px 0}.item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #eee}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.open{display:flex}.modalbox{background:#fff;border-radius:14px;padding:18px;width:min(700px,100%);max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:flex;flex-direction:column;gap:5px;font-size:13px}.full{grid-column:1/-1}.pricegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pricebox{border:1px solid #ddd;border-radius:9px;padding:10px}@media(max-width:800px){.grid,.form,.pricegrid{grid-template-columns:1fr}.wrap{padding:9px}}
</style></head>
<body><div class="wrap">
<div class="toolbar"><h1 style="margin-right:auto">SassSkin POS</h1></div>
<div class="toolbar" style="margin-bottom:12px">
<button id="addBtn" class="black">＋ Добавить товар</button><button id="scanBtn" class="black">▣ Сканировать</button>
<input id="search" placeholder="Поиск / штрихкод" style="flex:1;min-width:180px"><button id="backupBtn">💾 Backup</button><button id="restoreBtn">↩ Восстановить</button><input id="restoreFile" type="file" accept="application/json" hidden>
</div>
<div class="grid"><section class="card"><div class="toolbar"><button id="koreaBtn" class="black">🇰🇷 Корея</button><button id="chinaBtn">🇨🇳 Китай</button></div><h2>Товары</h2><div id="products" class="products"></div></section>
<aside class="card"><h2>Касса</h2><div class="toolbar"><button id="retailBtn" class="active">РОЗНИЦА</button><button id="wholesaleBtn">ОПТ</button></div><div id="cart"></div>
<div class="toolbar"><button id="pctBtn" class="active">%</button><button id="moneyBtn">₸</button><input id="discount" type="number" min="0" placeholder="Скидка" style="width:120px"></div>
<h2>Итого: <span id="total">0</span> ₸</h2><div class="actions"><button class="black" onclick="checkout('cash')">Наличные</button><button class="black" onclick="checkout('card')">Карта</button></div></aside></div></div>
<div id="modal" class="modal"><div class="modalbox"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
const KEY='sassskin_pos_v5';let db={schema:5,products:[],sales:[],seq:1,pin:'7777'},cart=[],mode='retail',discountType='percent',discountValue=0,section='korea';
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>Math.round(Number(n)||0).toLocaleString('ru-RU');
function norm(p){return {...p,id:p.id??('p_'+Date.now()+'_'+Math.random().toString(36).slice(2)),name:p.name||p.product||p.title||'Без названия',brand:p.brand||'',category:p.category||p.type||'',section:p.section||'korea',volume:p.volume||'',barcode:String(p.barcode||''),cost:Number(p.cost??p.purchasePrice??0),wholesalePrice:Number(p.wholesalePrice??p.wholesale??0),price:Number(p.price??p.retailPrice??0),stock:Number(p.stock??p.quantity??0),photo:p.photo||p.image||'',archived:!!p.archived}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function load(){try{let x=localStorage.getItem(KEY);if(x){db={...db,...JSON.parse(x)};db.products=(db.products||[]).map(norm)}let seed=Array.isArray(window.SASS_PRODUCTS)?window.SASS_PRODUCTS:[];for(const raw of seed){let p=norm(raw),f=db.products.find(x=>String(x.id)===String(p.id)||(p.barcode&&String(x.barcode)===p.barcode));if(!f)db.products.push(p)}save()}catch(e){alert(e.message)}}
function price(p){return mode==='wholesale'?(p.wholesalePrice||p.price):p.price}
function list(){let s=$('search').value.toLowerCase();return db.products.filter(p=>p.section===section&&!p.archived&&(!s||(p.name+' '+p.brand+' '+p.barcode).toLowerCase().includes(s)))}
function renderProducts(){$('products').innerHTML=list().map(p=>`<div class="card product"><b>${esc(p.name)}</b><div class="muted">${esc(p.brand)} ${esc(p.volume)}</div><div class="price">${money(price(p))} ₸</div><div class="muted">Остаток: ${p.stock}</div><div class="actions" style="margin-top:8px"><button onclick="view('${esc(p.id)}')">Открыть</button><button onclick="edit('${esc(p.id)}')">Изменить</button><button onclick="removeProduct('${esc(p.id)}')">Удалить</button><button onclick="add('${esc(p.id)}')">＋ В чек</button></div></div>`).join('')||'<p>Товаров не найдено.</p>'}
function add(id){let p=db.products.find(x=>String(x.id)===String(id));if(!p)return;if(p.stock<=0)return alert('Товара нет в наличии');let x=cart.find(x=>String(x.id)===String(id));if(x){if(x.qty>=p.stock)return alert('Недостаточно остатка');x.qty++}else cart.push({id:p.id,qty:1});renderCart()}
function renderCart(){$('cart').innerHTML=cart.map(x=>{let p=db.products.find(p=>String(p.id)===String(x.id));return `<div class="item"><div><b>${esc(p.name)}</b><div class="muted">${money(price(p))} ₸ × ${x.qty}</div></div><div><button onclick="qty('${esc(p.id)}',-1)">−</button>${x.qty}<button onclick="qty('${esc(p.id)}',1)">+</button></div></div>`}).join('')||'<p>Корзина пуста</p>';let raw=cart.reduce((s,x)=>s+price(db.products.find(p=>String(p.id)===String(x.id)))*x.qty,0);$('total').textContent=money(raw-discount(raw))}
function qty(id,d){let x=cart.find(x=>String(x.id)===String(id)),p=db.products.find(p=>String(p.id)===String(id));if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(y=>y!==x);if(x.qty>p.stock)x.qty=p.stock;renderCart()}
function discount(total){return Math.min(total,Math.max(0,discountType==='percent'?total*discountValue/100:discountValue))}
function modal(t,h){$('modalTitle').textContent=t;$('modalBody').innerHTML=h;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
function view(id){let p=db.products.find(x=>String(x.id)===String(id));modal('Карточка товара',`<h3>${esc(p.brand)} — ${esc(p.name)}</h3><div class="pricegrid"><div class="pricebox"><b>ПРИХОДНАЯ</b><br>${money(p.cost)} ₸</div><div class="pricebox"><b>ОПТОВАЯ</b><br>${money(p.wholesalePrice)} ₸</div><div class="pricebox"><b>РОЗНИЧНАЯ</b><br>${money(p.price)} ₸</div></div><p>Штрихкод: ${esc(p.barcode||'—')}<br>Остаток: ${p.stock}<br>Объём: ${esc(p.volume||'—')}</p><div class="actions"><button class="black" onclick="edit('${esc(p.id)}')">Изменить</button><button onclick="add('${esc(p.id)}');closeModal()">В чек</button><button onclick="closeModal()">Закрыть</button></div>`)}
function form(p={}){return `<form id="pf" class="form"><label>Название<input name="name" required value="${esc(p.name||'')}"></label><label>Бренд<input name="brand" value="${esc(p.brand||'')}"></label><label>Категория<input name="category" value="${esc(p.category||'')}"></label><label>Раздел<select name="section"><option value="korea" ${p.section==='korea'?'selected':''}>🇰🇷 Корея</option><option value="china" ${p.section==='china'?'selected':''}>🇨🇳 Китай</option></select></label><label>Объём<input name="volume" value="${esc(p.volume||'')}"></label><label>Штрихкод<input name="barcode" value="${esc(p.barcode||'')}"></label><label>Приходная<input name="cost" type="number" min="0" value="${p.cost||0}"></label><label>Оптовая<input name="wholesalePrice" type="number" min="0" value="${p.wholesalePrice||0}"></label><label>Розничная<input name="price" type="number" min="0" value="${p.price||0}"></label><label>Остаток<input name="stock" type="number" min="0" value="${p.stock||0}"></label><label class="full">Фото URL<input name="photo" value="${esc(p.photo||'')}"></label><div class="full actions"><button class="black" type="submit">Сохранить</button><button type="button" onclick="closeModal()">Отмена</button></div></form>`}
function edit(id){let p=db.products.find(x=>String(x.id)===String(id));modal('Изменить товар',form(p));$('pf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);['name','brand','category','section','volume','barcode','photo'].forEach(k=>p[k]=String(f.get(k)||''));['cost','wholesalePrice','price','stock'].forEach(k=>p[k]=Number(f.get(k)||0));save();closeModal();renderAll()}}
function addProduct(){modal('Добавить товар',form({section}));$('pf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=norm({id:'p_'+Date.now()});['name','brand','category','section','volume','barcode','photo'].forEach(k=>p[k]=String(f.get(k)||''));['cost','wholesalePrice','price','stock'].forEach(k=>p[k]=Number(f.get(k)||0));if(p.barcode&&db.products.some(x=>x.barcode===p.barcode))return alert('Такой штрихкод уже есть');db.products.push(p);save();closeModal();renderAll()}}
function removeProduct(id){let p=db.products.find(x=>String(x.id)===String(id)),sold=db.sales.some(s=>(s.items||[]).some(i=>String(i.id)===String(id)));if(sold){if(confirm('Товар уже продавался. Архивировать его?')){p.archived=true;save();renderAll()}}else if(confirm('Удалить товар?')){db.products=db.products.filter(x=>String(x.id)!==String(id));save();renderAll()}}
function scan(){let code=prompt('Введите штрихкод (камера/сканер устройства может передать его в это поле)');if(!code)return;let p=db.products.find(x=>x.barcode===String(code));if(p)view(p.id);else{modal('Товар не найден',`<p>Штрихкод: <b>${esc(code)}</b></p><button class="black" onclick="closeModal();addProduct()">Создать товар</button>`)}}
function checkout(method){if(!cart.length)return alert('Корзина пуста');let raw=cart.reduce((s,x)=>s+price(db.products.find(p=>String(p.id)===String(x.id)))*x.qty,0),d=discount(raw);if(raw&&d/raw*100>20&&prompt('PIN владельца')!==db.pin)return alert('Неверный PIN');let items=cart.map(x=>{let p=db.products.find(p=>String(p.id)===String(x.id));return{id:p.id,name:p.name,qty:x.qty,price:price(p),cost:p.cost}});items.forEach(i=>{let p=db.products.find(p=>String(p.id)===String(i.id));p.stock=Math.max(0,p.stock-i.qty)});db.sales.unshift({no:db.seq++,time:new Date().toISOString(),mode,items,subtotal:raw,discountType,discountValue,discount:d,total:raw-d,method});save();cart=[];discountValue=0;$('discount').value='';renderAll();alert('Продажа проведена')}
function backup(){let b=new Blob([JSON.stringify({version:5,exportedAt:new Date().toISOString(),db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sassskin-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function restore(){$('restoreFile').click()}$('restoreFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.db||!Array.isArray(x.db.products))throw Error('Неверный backup');if(!confirm('Восстановить эту базу?'))return;db=x.db;db.products=(db.products||[]).map(norm);save();renderAll();alert('Восстановлено')}catch(err){alert(err.message)}};r.readAsText(f)}
function renderAll(){renderProducts();renderCart()}
$('addBtn').onclick=addProduct;$('scanBtn').onclick=scan;$('search').oninput=renderProducts;$('koreaBtn').onclick=()=>{section='korea';$('koreaBtn').classList.add('black');$('chinaBtn').classList.remove('black');renderProducts()};$('chinaBtn').onclick=()=>{section='china';$('chinaBtn').classList.add('black');$('koreaBtn').classList.remove('black');renderProducts()};$('retailBtn').onclick=()=>{mode='retail';$('retailBtn').classList.add('active');$('wholesaleBtn').classList.remove('active');renderAll()};$('wholesaleBtn').onclick=()=>{mode='wholesale';$('wholesaleBtn').classList.add('active');$('retailBtn').classList.remove('active');renderAll()};$('pctBtn').onclick=()=>{discountType='percent';$('pctBtn').classList.add('active');$('moneyBtn').classList.remove('active');renderCart()};$('moneyBtn').onclick=()=>{discountType='money';$('moneyBtn').classList.add('active');$('pctBtn').classList.remove('active');renderCart()};$('discount').oninput=()=>{discountValue=Math.max(0,Number($('discount').value)||0);renderCart()};$('backupBtn').onclick=backup;$('restoreBtn').onclick=restore;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};load();renderAll();
</script>
</body></html>
